# Haard-server: lokale AI + spraak voor Home Assistant en ai.timvanbergen.nl.
# Alles draait op de CPU (i7-4770, AVX2); er is geen videokaart nodig.
#
#   ollama      taalmodel (llama.cpp eronder), poort 11434 — voor Open WebUI en Home Assistant
#   open-webui  de chatsite, achter de Cloudflare Tunnel op ai.timvanbergen.nl
#   whisper     spraak → tekst (Wyoming, poort 10300) — Home Assistant gebruikt dit
#   piper       tekst → spraak (Wyoming, poort 10200) — Nederlandse stem
#   cloudflared tunnel naar Cloudflare, zodat er geen poorten open hoeven in de router

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["./data/ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"          # model blijft in het geheugen: geen laadtijd per vraag
      OLLAMA_NUM_PARALLEL: "2"         # twee plekken: Home Assistant houdt zo zijn lange vaste prompt in de cache, naast Open WebUI
      OLLAMA_MAX_LOADED_MODELS: "1"      # nooit twee grote modellen tegelijk: dat past niet in 24 GB
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"     # halve geheugen voor de context
      OLLAMA_CONTEXT_LENGTH: "${CONTEXT:-8192}"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on: [ollama]
    ports: ["127.0.0.1:3000:8080"]
    volumes: ["./data/open-webui:/app/backend/data"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_NAME: "AI van Tim"
      WEBUI_URL: https://ai.timvanbergen.nl
      DEFAULT_LOCALE: nl-NL
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: pending       # eerste account = beheerder, nieuwe accounts wachten op goedkeuring
      DEFAULT_MODELS: "${MODEL}"
      ENABLE_OPENAI_API: "false"
      # Titels en tags laten maken kost op de CPU telkens een extra antwoord
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"

  whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: whisper
    restart: unless-stopped
    ports: ["10300:10300"]
    volumes: ["./data/whisper:/data"]
    command: >-
      --model ${WHISPER_MODEL:-small-int8} --language nl --beam-size 1
      --initial-prompt "Zet de lamp op wit. Zet mijn lamp op rood, blauw, groen, geel of paars. Doe de lamp in Tims kamer aan of uit. Maak de lamp feller. Wat voor weer wordt het morgen? Speel muziek van Frenna op de Sonos Roam. Wat staat er morgen op mijn agenda?"

  # Speech-to-Phrase: verstaat vaste commando's ("doe de lamp aan", timers, tijd) in een fractie van een seconde.
  # De app stuurt het geluid tegelijk hierheen en naar Whisper; is dit een bekend commando, dan gaat het meteen.
  speech-to-phrase:
    image: rhasspy/wyoming-speech-to-phrase:latest
    container_name: speech-to-phrase
    restart: unless-stopped
    depends_on: [ha-lijst]
    ports: ["10301:10300"]
    volumes: ["./data/stp/train:/train", "./data/stp/models:/models"]
    command: >-
      --uri tcp://0.0.0.0:10300 --train-dir /train --models-dir /models
      --hass-websocket-uri ws://ha-lijst:8124/api/websocket --hass-token geen --retrain-on-start

  # De lijst met lampen, kamers en taal voor Speech-to-Phrase (momentopname, zonder sleutels)
  ha-lijst:
    image: rhasspy/wyoming-speech-to-phrase:latest
    container_name: ha-lijst
    restart: unless-stopped
    entrypoint: ["/usr/src/.venv/bin/python3", "/data/ha_lijst.py"]
    volumes: ["./stp:/data:ro"]

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: piper
    restart: unless-stopped
    ports: ["10200:10200"]
    volumes: ["./data/piper:/data"]
    command: --voice ${PIPER_STEM:-nl_NL-mls-medium}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host                 # bereikt Open WebUI op 127.0.0.1:3000
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    profiles: [tunnel]                 # start pas als TUNNEL_TOKEN in .env staat (zie install.sh)
